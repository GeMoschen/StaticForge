server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA client-side routing: fall back to index.html for any non-file path so
    # deep links and refreshes resolve in the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend. No trailing path on proxy_pass preserves the full
    # original URI (e.g. /api/v1/...) which is what the backend controllers expect.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
