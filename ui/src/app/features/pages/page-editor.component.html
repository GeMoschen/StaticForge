<div class="page-editor" [class.page-editor--time-travel]="editor.readOnly()">
  <h1 class="sf-sr-only">
    {{ editor.page()?.displayName ?? editor.page()?.uid ?? 'Page editor' }}
  </h1>
  <sf-page-editor-header />
  <sf-release-bar
    [projectKey]="projectKey()"
    [assetUuid]="uuid()"
    [refreshKey]="editor.releaseRefresh()"
    (changed)="editor.onReleaseChanged($event)"
  />

  <div class="page-editor__body">
    <div class="page-editor__main" #main>
      <div class="page-editor__centre" [style.flex]="editor.centreFlex()">
        <sf-page-editor-scope />
        @if (!editor.error()) {
          <sf-page-editor-issues
            [focusRoot]="main"
            (previewFocus)="preview.focusSection($event.instanceId, $event.selector)"
          />
        }
      </div>
      <sf-page-editor-preview #preview [container]="main" />
    </div>
  </div>

  <sf-section-palette />
  <sf-page-editor-conflict />
</div>
