<div
  class="folder-node"
  [class.folder-node--selected]="isSelected()"
  [style.padding-left.px]="depth() * 14"
>
  <div
    class="folder-node__row"
    draggable="true"
    role="treeitem"
    tabindex="0"
    [attr.aria-expanded]="expanded()"
    [attr.aria-selected]="isSelected()"
    (click)="onSelect()"
    (keydown)="onKeydown($event)"
    (dragstart)="onDragStart($event)"
    (dragover)="onDragOver($event)"
    (drop)="onDrop($event)"
    (dragend)="onDragEnd()"
    (contextmenu)="onContextMenu($event)"
  >
    <button
      type="button"
      class="folder-node__toggle"
      [class.folder-node__toggle--leaf]="!hasChildren()"
      (click)="toggle($event)"
      [attr.aria-label]="hasChildren() ? 'Toggle folder' : 'Folder'"
    >
      <sf-icon [name]="expanded() ? 'expand_more' : 'chevron_right'" />
    </button>
    <sf-icon class="folder-node__icon" [name]="expanded() && hasChildren() ? 'folder_open' : 'folder'" />
    <span class="folder-node__name">{{ node().displayName ?? node().uid }}</span>
  </div>

  @if (expanded() && hasChildren()) {
    <div class="folder-node__children" role="group">
      @for (child of node().children ?? []; track child.uuid) {
        <sf-folder-node
          [node]="child"
          [depth]="depth() + 1"
          [selectedUuid]="selectedUuid()"
          [projectKey]="projectKey()"
          [pagesByFolder]="pagesByFolder()"
          (select)="select.emit($event)"
          (move)="move.emit($event)"
          (newPage)="newPage.emit()"
          (changed)="changed.emit()"
        />
      }
      @for (page of ownPages(); track page.uuid) {
        <sf-page-nav-node
          [projectKey]="projectKey()"
          [summary]="page"
          [depth]="depth() + 1"
          (changed)="changed.emit()"
        />
      }
    </div>
  }

  <sf-create-asset-dialog
    kind="FOLDER"
    scope="PAGES"
    [open]="newFolderOpen()"
    [submitting]="creatingFolder()"
    [projectKey]="projectKey()"
    (create)="submitNewFolder($event)"
    (closed)="closeNewFolder()"
  />

  <sf-rename-asset-dialog
    [open]="renameOpen()"
    [projectKey]="projectKey()"
    [uuid]="node().uuid ?? ''"
    [uid]="node().uid ?? ''"
    [displayName]="node().displayName ?? node().uid ?? ''"
    [submittingName]="renamingName()"
    (renameDisplayName)="submitRenameDisplayName($event)"
    (uidChanged)="onRenameUidChanged()"
    (closed)="closeRename()"
  />
</div>
