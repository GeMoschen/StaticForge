@if (palette.body(); as body) {
  <div class="page-editor__overlay" (click)="palette.close()">
    <div
      class="page-editor__palette"
      (click)="$event.stopPropagation()"
      role="dialog"
      aria-modal="true"
      aria-labelledby="page-editor-palette-title"
    >
      <h3 id="page-editor-palette-title" class="page-editor__palette-title">
        Add section to {{ body.label ?? body.name }}
      </h3>
      <ul class="page-editor__palette-list">
        @for (tpl of palette.allowedTemplates(body); track tpl.uuid) {
          <li>
            <button type="button" (click)="palette.add(body, tpl.uuid ?? '')">
              <span>{{ tpl.displayName ?? tpl.uid }}</span>
              <span class="page-editor__mono">{{ tpl.uid }}</span>
            </button>
          </li>
        }
      </ul>
    </div>
  </div>
}
