<div
  class="section-card"
  [attr.draggable]="readOnly() ? null : 'true'"
  (dragstart)="onDragStart($event)"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
  (dragend)="onDragEnd()"
>
  <header
    class="section-card__header"
    tabindex="0"
    role="group"
    (click)="toggleCollapsed()"
    (keydown)="onHeaderKeydown($event)"
  >
    <button
      type="button"
      class="section-card__toggle"
      (click)="toggleCollapsed($event)"
      aria-label="Toggle section"
    >
      <sf-icon [name]="collapsed() ? 'chevron_right' : 'expand_more'" />
    </button>
    <sf-icon class="section-card__icon" name="widgets" />
    <span class="section-card__title">{{ title() }}</span>
    @if (!readOnly() && !hideActions()) {
      <div class="section-card__actions">
        <button
          type="button"
          [disabled]="index() <= 0"
          (click)="moveUp.emit(); $event.stopPropagation()"
          aria-label="Move up"
        >
          <sf-icon name="arrow_upward" />
        </button>
        <button
          type="button"
          [disabled]="index() >= count() - 1"
          (click)="moveDown.emit(); $event.stopPropagation()"
          aria-label="Move down"
        >
          <sf-icon name="arrow_downward" />
        </button>
        <button
          type="button"
          class="section-card__remove"
          (click)="remove.emit(); $event.stopPropagation()"
          aria-label="Remove section"
        >
          <sf-icon name="delete" />
        </button>
      </div>
    }
  </header>

  @if (!collapsed()) {
    <div class="section-card__body">
      <sf-content-form
        [definition]="contentDefinition()"
        [formGroup]="fieldForm()"
        [projectKey]="projectKey()"
      />
    </div>
  }
</div>
