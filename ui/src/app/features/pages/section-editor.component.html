<div
  class="section-card"
  [attr.data-sf-section]="section().instanceId"
  [attr.draggable]="readOnly() ? null : 'true'"
  (dragstart)="onDragStart($event)"
  (dragover)="onDragOver($event)"
  (drop)="onDrop($event)"
  (dragend)="onDragEnd()"
>
  <header
    class="section-card__header"
    tabindex="0"
    role="group"
    (click)="toggleCollapsed()"
    (keydown)="onHeaderKeydown($event)"
  >
    <button
      type="button"
      class="section-card__toggle"
      (click)="toggleCollapsed($event)"
      [attr.aria-label]="'pages.editor.section.toggle' | transloco"
    >
      <sf-icon [name]="collapsed() ? 'chevron_right' : 'expand_more'" />
    </button>
    <sf-icon class="section-card__icon" name="widgets" />
    <span class="section-card__title">{{ title() }}</span>
    @if (!readOnly()) {
      <!-- A press or key inside the menu is the menu's: it must not fold the card (the header's own keys). -->
      <div class="section-card__actions" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
        <sf-menu size="sm" [items]="menuItems()" [label]="'pages.editor.section.actions' | transloco: { name: title() }" (itemSelected)="onMenu($event)" />
      </div>
    }
  </header>

  @if (!collapsed()) {
    <div class="section-card__body">
      <sf-content-form
        [definition]="contentDefinition()"
        [formGroup]="fieldForm()"
        [projectKey]="projectKey()"
        [issues]="issues()"
        [issuePrefix]="issuePrefix()"
        [fieldStates]="fieldStates()"
        [ruleHub]="readOnly() ? null : rules()"
        (filled)="onInnerFilled()"
        [editingLocale]="editingLocale()"
        [storedValue]="storedContent()"
        [localeLabels]="localeLabels()"
      />
    </div>
  }
</div>
