<sf-splitter
  class="pages"
  collapsible
  paneId="pages-tree"
  [defaultSize]="treeWidth"
  [min]="200"
  [max]="440"
  [label]="'pages.tree.resize' | transloco"
>
  <section sfSplitterStart class="pages__pane pages__tree" aria-labelledby="pages-tree-title">
    <div class="pages__head">
      <span class="pages__title" id="pages-tree-title">{{ 'pages.tree.title' | transloco }}</span>
      <sf-menu
        variant="secondary"
        size="sm"
        align="end"
        [text]="'pages.tree.new' | transloco"
        [label]="'pages.tree.newLabel' | transloco"
        [items]="newItems()"
        [disabled]="readOnly()"
      />
    </div>
    <sf-tree
      class="pages__treebody"
      treeId="pages"
      filterMode="server"
      rootDroppable
      [label]="'pages.tree.title' | transloco"
      [projectKey]="projectKey()"
      [loadChildren]="loader()"
      [selection]="treeSelection()"
      [actions]="treeActions"
      [createKinds]="['folder']"
      [allowAction]="allowAction"
      [canDrop]="canDrop"
      [validateName]="validateName"
      [confirmDelete]="confirmDelete"
      [menuItems]="menuItems"
      [emptyMenuItems]="rootMenuItems"
      (emptyClick)="openFolder(null)"
      [search]="search"
      (open)="onOpen($event)"
      (create)="onCreate($event)"
      (rename)="onRename($event)"
      (delete)="onDelete($event)"
      (move)="onMove($event)"
      (moveTo)="openMoveDialog($event)"
    />
  </section>

  <div sfSplitterEnd class="pages__pane pages__content">
    @switch (mode()) {
      @case ('favorites') {
        <sf-favorites-view />
      }
      @case ('folder') {
        @if (emptyProject()) {
          <sf-empty-state
            icon="note_add"
            [title]="'pages.empty.title' | transloco"
            [description]="('pages.empty.' + (hasTemplates() ? 'templates' : isDeveloper() ? 'developer' : 'editor')) | transloco"
            [primaryLabel]="primaryLabel()"
            [primaryIcon]="hasTemplates() ? 'note_add' : 'code_blocks'"
            [secondaryLabel]="readOnly() ? null : ('pages.empty.createFolder' | transloco)"
            (primary)="onEmptyPrimary()"
            (secondary)="createFolderAtRoot()"
          />
        } @else if (loaded()) {
          <sf-folder-view [projectKey]="projectKey()" [folderUuid]="folderUuid()" (openPage)="openPage($event)" (openFolder)="openFolder($event)" />
        }
      }
    }
    <router-outlet />
  </div>
</sf-splitter>

<sf-create-asset-dialog
  kind="PAGE"
  [open]="newPageOpen()"
  [submitting]="creatingPage()"
  [projectKey]="projectKey()"
  [templates]="pageTemplates()"
  (create)="submitNewPage($event)"
  (closed)="newPageOpen.set(false)"
/>

@if (deleting(); as page) {
  <sf-page-delete-dialog [projectKey]="projectKey()" [page]="page" (deleted)="onPageDeleted()" (closed)="deleting.set(null)" />
}

@if (moving()) {
  <sf-folder-move-dialog
    [tree]="folderTree()"
    [excluded]="movingFolders()"
    [count]="moving()!.length"
    (chosen)="onMoveChosen($event)"
    (cancelled)="moving.set(null)"
  />
}
