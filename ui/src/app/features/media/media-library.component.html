@if (library.selectedMedia(); as media) {
  <sf-media-detail-drawer
    #detailDrawer
    [projectKey]="projectKey()"
    [media]="media"
    (closed)="library.closeDetail()"
    (updated)="library.onUpdated($event)"
    (deleted)="library.onDeleted($event)"
    (discarded)="library.onDiscarded($event)"
  />
}

@if (itemActions.renamingItem(); as ri) {
  <sf-rename-asset-dialog
    [open]="true"
    [projectKey]="projectKey()"
    [uuid]="ri.uuid ?? ''"
    [uid]="ri.uid ?? ''"
    [displayName]="ri.displayName ?? ri.uid ?? ''"
    [submittingName]="itemActions.renamingItemName()"
    (renameDisplayName)="itemActions.submitRenameItemDisplayName($event)"
    (uidChanged)="library.reloadMedia()"
    (closed)="itemActions.closeRenameItem()"
  />
}

@if (folders.renamingFolder(); as rf) {
  <sf-media-folder-detail
    [projectKey]="projectKey()"
    [folder]="rf"
    [mediaCount]="folders.renamingFolderMediaCount()"
    [folderCount]="rf.children?.length ?? 0"
    (close)="folders.closeFolderDetail()"
    (renamed)="folders.onFolderDetailChanged()"
    (deleted)="folders.onFolderDetailChanged()"
  />
}

<div
  class="library"
  sfDropTarget
  (dragenter)="uploads.onDragEnter($event)"
  (dragleave)="uploads.onDragLeave()"
  (drop)="uploads.onDrop($event)"
>
  <h1 class="sf-sr-only">Media</h1>

  <sf-media-library-sidebar />

  <div class="library__main">
    <sf-media-library-toolbar />
    <sf-media-library-grid />
    <sf-media-library-uploads />
  </div>
</div>

@if (uploads.dragActive()) {
  <div class="drop-overlay">Drop files to upload</div>
}

<sf-create-asset-dialog
  kind="FOLDER"
  scope="MEDIA"
  [open]="folders.newFolderOpen()"
  [submitting]="folders.creatingFolder()"
  [projectKey]="projectKey()"
  (create)="folders.submitNewFolder($event)"
  (closed)="folders.closeNewFolder()"
/>
