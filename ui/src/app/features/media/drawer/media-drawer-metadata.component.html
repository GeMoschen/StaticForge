<form [formGroup]="metadata.form">
  <sf-field label="Alt text" hint="Required before publishing">
    <input type="text" formControlName="altText" placeholder="Descriptive alt text" />
    @if (metadata.form.controls.altText.invalid && metadata.form.controls.altText.touched) {
      <span class="error">Alt text is required before publishing</span>
    }
  </sf-field>

  <sf-field label="Caption">
    <input type="text" formControlName="caption" placeholder="Optional caption" />
  </sf-field>

  <sf-field label="Copyright">
    <input type="text" formControlName="copyright" placeholder="© Owner (year)" />
  </sf-field>

  <div class="focal">
    <sf-field label="Focal point X" hint="0 – 1">
      <input type="number" formControlName="focalX" min="0" max="1" step="0.01" />
    </sf-field>
    <sf-field label="Focal point Y" hint="0 – 1">
      <input type="number" formControlName="focalY" min="0" max="1" step="0.01" />
    </sf-field>
  </div>

  <sf-button
    variant="primary"
    [disabled]="metadata.saving() || core.readOnly() || !metadata.metadataDirty()"
    (click)="metadata.save()"
  >
    Save metadata
  </sf-button>
</form>
