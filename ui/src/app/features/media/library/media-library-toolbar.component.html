<!-- The search field keeps ←/→, so a roving toolbar could not be left toward the other controls: all of them are tab stops. -->
<sf-toolbar [label]="'media.toolbar.label' | transloco" [roving]="false">
  <sf-search-input
    class="toolbar__search"
    [value]="library.search()"
    [placeholder]="'media.toolbar.search' | transloco"
    [aria-label]="'media.toolbar.search' | transloco"
    (valueChange)="library.setSearch($event)"
  />
  <sf-select
    class="toolbar__type"
    [options]="typeOptions()"
    [value]="library.typeFilter()"
    [aria-label]="'media.toolbar.type' | transloco"
    (valueChange)="library.setTypeFilter($event ?? 'all')"
  />
  <sf-menu variant="secondary" align="start" [text]="sortText()" [label]="'media.toolbar.sort' | transloco" [items]="sortItems()" />
  <span class="toolbar__spacer"></span>
  <sf-segmented
    size="sm"
    [options]="viewOptions()"
    [value]="library.view()"
    [aria-label]="'media.toolbar.view' | transloco"
    (valueChange)="library.setView($event ?? 'grid')"
  />
  @if (!uploads.canUpload()) {
    <span class="toolbar__readonly">{{ uploads.blockedReason() }}</span>
  }
  <sf-button icon="upload" [disabled]="!uploads.canUpload()" (click)="fileInput.click()">{{ 'media.toolbar.upload' | transloco }}</sf-button>
  <input #fileInput class="sf-sr-only" type="file" multiple tabindex="-1" aria-hidden="true" [disabled]="!uploads.canUpload()" (change)="uploads.onFileInput($event)" />
</sf-toolbar>
