<div
  class="grid"
  role="grid"
  aria-multiselectable="true"
  [attr.aria-label]="'media.grid.label' | transloco: { folder: folderName() }"
  (keydown)="onKeydown($event)"
>
  <div class="grid__row" role="row">
    @for (file of library.shown(); track file.uuid) {
      <div
        class="card"
        role="gridcell"
        [class.is-selected]="library.isSelected(file.uuid)"
        [class.is-open]="library.assetUuid() === file.uuid"
        [attr.tabindex]="tabStop() === file.uuid ? 0 : -1"
        [attr.aria-selected]="library.isSelected(file.uuid)"
        [attr.aria-label]="cardLabel(file)"
        [attr.data-file]="file.uuid"
        [attr.draggable]="library.canEdit() ? 'true' : null"
        (focus)="onFocus(file)"
        (click)="onClick(file, $event)"
        (contextmenu)="onContextMenu($event, file)"
        (dragstart)="mover.startDrag($event, file.uuid)"
      >
        <div class="card__thumb">
          <sf-media-preview [item]="file" />
        </div>
        <sf-checkbox
          class="card__check"
          [value]="library.isSelected(file.uuid)"
          [controlTabindex]="-1"
          [aria-label]="'media.grid.select' | transloco: { name: file.displayName }"
          (valueChange)="onCheck(file)"
        />
        <span class="card__more">
          <sf-menu size="sm" [items]="items.menuItems(file)" [label]="'media.menu.label' | transloco: { name: file.displayName }" />
        </span>
        @if (library.statusOf(file); as status) {
          <sf-status class="card__status" size="sm" iconOnly [tone]="status.tone" [icon]="status.icon" [label]="status.label" />
        }
        <div class="card__text">
          <span class="card__name">{{ file.displayName }}</span>
          <span class="card__meta">{{ 'media.grid.meta' | transloco: { type: format(file), size: (file.sizeBytes | sfFileSize) } }}</span>
        </div>
      </div>
    }
  </div>
  <div #sentinel class="grid__sentinel" aria-hidden="true"></div>
  @if (library.loadingMore()) {
    <p class="grid__more" role="status">{{ 'media.library.loadingMore' | transloco }}</p>
  }
</div>
