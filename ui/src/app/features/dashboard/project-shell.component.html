<div class="shell">
  <a class="sf-skip-link" href="#sf-main-content">Skip to content</a>
  <sf-revision-spine
    class="shell__spine"
    [projectKey]="projectKey()"
    [revisions]="store.revisions()"
    [currentRevision]="store.currentRevision()"
    (tickSelected)="onTick($event)"
  />
  <sf-nav-rail class="shell__rail" />
  <main
    id="sf-main-content"
    class="shell__content"
    [class.shell__content--time-travel]="timeTravel.isTimeTravel()"
  >
    @if (timeTravel.isTimeTravel()) {
      <div class="shell__timemachine">
        <span class="shell__timemachine-label">
          Viewing revision {{ timeTravel.activeRevision() }}
        </span>
        <button class="shell__timemachine-back" type="button" (click)="backToNow()">
          Back to now
        </button>
      </div>
    }
    <router-outlet />
  </main>
</div>
