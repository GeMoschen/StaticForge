<sf-splitter
  class="content"
  collapsible
  paneId="content-tree"
  [defaultSize]="treeWidth"
  [min]="200"
  [max]="440"
  [label]="'content.tree.resize' | transloco"
>
  <section sfSplitterStart class="content__pane content__tree" aria-labelledby="content-tree-title">
    <div class="content__head">
      <span class="content__title" id="content-tree-title">{{ 'content.tree.title' | transloco }}</span>
      <sf-menu
        variant="secondary"
        size="sm"
        align="end"
        [text]="'content.tree.new' | transloco"
        [label]="'content.tree.newLabel' | transloco"
        [items]="newItems()"
        [disabled]="!canEdit()"
      />
    </div>
    <sf-tree
      class="content__treebody"
      treeId="content"
      filterMode="server"
      rootDroppable
      [label]="'content.tree.title' | transloco"
      [projectKey]="projectKey()"
      [loadChildren]="loader()"
      [selection]="treeSelection()"
      [actions]="treeActions"
      [createKinds]="['folder']"
      [allowAction]="allowAction"
      [canDrop]="canDrop"
      [validateName]="validateName"
      [confirmDelete]="confirmDelete"
      [menuItems]="menuItems"
      [emptyMenuItems]="rootMenuItems"
      (emptyClick)="openFolder(null)"
      [search]="search"
      (open)="onOpen($event)"
      (create)="onCreate($event)"
      (rename)="onRename($event)"
      (delete)="onDelete($event)"
      (move)="onMove($event)"
      (moveTo)="openMoveDialog($event)"
    />
  </section>

  <div sfSplitterEnd class="content__pane content__main">
    @switch (mode()) {
      @case ('favorites') {
        <sf-favorites-view />
      }
      @case ('folder') {
        @if (emptyStore()) {
          <sf-empty-state
            [icon]="noDatasets() ? 'code_blocks' : setIcon"
            [title]="(noDatasets() ? 'content.shell.empty.noDatasets' : 'content.shell.empty.noRecordSets') | transloco"
            [description]="('content.shell.empty.' + emptyKind()) | transloco"
            [primaryLabel]="primaryLabel()"
            [primaryIcon]="noDatasets() ? 'code_blocks' : 'playlist_add'"
            [secondaryLabel]="canEdit() ? ('content.shell.empty.createFolder' | transloco) : null"
            (primary)="onEmptyPrimary()"
            (secondary)="createFolderAtRoot()"
          />
        } @else {
          <sf-content-folder-view
            [projectKey]="projectKey()"
            [folderUuid]="folderUuid()"
            [index]="index()"
            [tree]="folders()"
            [datasets]="datasets()"
            [loading]="!loaded()"
            [failed]="failed()"
            (openSet)="openSet($event)"
            (openFolder)="openFolder($event)"
            (newFolder)="openNewFolder()"
            (newRecordSet)="openNewSetHere()"
            (rename)="renameInTree($event)"
            (retry)="changed()"
          />
        }
      }
    }
    <router-outlet />
  </div>
</sf-splitter>

<sf-create-asset-dialog
  kind="FOLDER"
  scope="CONTENT"
  [open]="newFolderOpen()"
  [submitting]="creating()"
  [projectKey]="projectKey()"
  (create)="submitNewFolder($event)"
  (closed)="newFolderOpen.set(false)"
/>

<sf-create-asset-dialog
  kind="RECORD_SET"
  scope="CONTENT"
  [open]="newSetOpen()"
  [submitting]="creating()"
  [projectKey]="projectKey()"
  [datasets]="datasets()"
  (create)="submitNewSet($event)"
  (closed)="newSetOpen.set(false)"
/>

@if (moving()) {
  <sf-folder-move-dialog
    [tree]="folderTree()"
    [excluded]="movingFolders()"
    [count]="moving()!.length"
    [rootLabel]="'content.folder.root' | transloco"
    (chosen)="onMoveChosen($event)"
    (cancelled)="moving.set(null)"
  />
}
