<header class="preview-toolbar">
  <div class="preview-toolbar__group">
    @for (option of viewports; track option.key) {
      <button
        type="button"
        class="preview-toolbar__button"
        [class.preview-toolbar__button--active]="viewport() === option.key"
        (click)="viewport.set(option.key)"
      >
        {{ option.label }}
      </button>
    }
  </div>

  @if (totalPages() > 1) {
    <div class="preview-toolbar__group preview-pages" role="group" aria-label="Preview page">
      <button
        type="button"
        class="preview-toolbar__button"
        [disabled]="page() <= 1"
        aria-label="Previous page"
        (click)="goToPage(page() - 1)"
      >
        ‹
      </button>
      <label class="preview-pages__label">
        <span class="preview-pages__visually-hidden">Page</span>
        <select class="preview-pages__select" [value]="page()" (change)="onPageSelect($event)">
          @for (number of pages(); track number) {
            <option [value]="number" [selected]="number === page()">Page {{ number }} of {{ totalPages() }}</option>
          }
        </select>
      </label>
      <button
        type="button"
        class="preview-toolbar__button"
        [disabled]="page() >= totalPages()"
        aria-label="Next page"
        (click)="goToPage(page() + 1)"
      >
        ›
      </button>
      <span class="preview-pages__visually-hidden" aria-live="polite">Page {{ page() }} of {{ totalPages() }}</span>
    </div>
  }

  <div class="preview-toolbar__group">
    <button type="button" class="preview-toolbar__button" (click)="refreshManually()">
      Refresh
    </button>

    @if (pageUuid()) {
      <button
        type="button"
        class="preview-toolbar__button"
        [disabled]="archived()"
        [title]="archived() ? 'An archived project has no share links.' : ''"
        (click)="share()"
      >
        Share
      </button>
    }
  </div>
</header>

<div class="preview-stage">
  <div class="preview-stage__frame" [style.width]="viewportWidth()">
    <iframe
      #frame
      class="preview-frame"
      [srcdoc]="srcdoc()"
      sandbox="allow-scripts"
      title="Live preview"
    ></iframe>
  </div>
</div>

@if (shareUrl()) {
  <div class="preview-share">
    <input class="preview-share__input" type="text" readonly [value]="shareUrl() ?? ''" />
    <button type="button" class="preview-share__copy" (click)="copyShareUrl()">
      Copy
    </button>
  </div>
}
