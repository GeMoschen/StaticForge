<a class="sf-skip-link" href="#sf-main-content">{{ 'frame.region.skipLink' | transloco }}</a>

<sf-frame-topbar class="frame__topbar" />

@if (projectKey() !== null) {
  <div class="frame__banners">
    <sf-archived-banner [projectKey]="projectKey()" />
    <sf-time-travel-banner (back)="backToNow()" />
  </div>
}

<div class="frame__body">
  @if (hasRail()) {
    <sf-frame-rail class="frame__rail" />
  }
  <main id="sf-main-content" class="frame__main" [class.frame__main--time-travel]="timeTravel.isTimeTravel()" tabindex="-1">
    <router-outlet />
  </main>
</div>

@if (projectKey() !== null && history.isOpen()) {
  <sf-history-drawer />
}
