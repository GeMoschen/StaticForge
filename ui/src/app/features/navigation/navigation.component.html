<sf-splitter
  class="nav"
  collapsible
  paneId="navigation-tree"
  [defaultSize]="treeWidth"
  [min]="220"
  [max]="460"
  [label]="'navigation.tree.resize' | transloco"
>
  <section sfSplitterStart class="nav__pane nav__tree" aria-labelledby="nav-tree-title">
    <div class="nav__head">
      <span class="nav__title" id="nav-tree-title">{{ 'navigation.tree.title' | transloco }}</span>
      <sf-menu
        variant="secondary"
        size="sm"
        align="end"
        [text]="'navigation.tree.new' | transloco"
        [label]="'navigation.tree.newLabel' | transloco"
        [items]="newItems()"
        [disabled]="!canEdit()"
      />
    </div>
    <sf-tree
      class="nav__treebody"
      treeId="navigation"
      filterMode="server"
      sort="none"
      reorderable
      rootDroppable
      [label]="'navigation.tree.title' | transloco"
      [projectKey]="projectKey()"
      [loadChildren]="loader()"
      [selection]="treeSelection()"
      [multiselect]="false"
      [actions]="treeActions"
      [createKinds]="['folder']"
      [allowAction]="allowAction"
      [canDrop]="canDrop"
      [validateName]="validateName"
      [confirmDelete]="confirmDelete"
      [menuItems]="menuItems"
      [search]="search"
      (open)="onOpen($event)"
      (create)="onCreate($event)"
      (rename)="onRename($event)"
      (delete)="onDelete($event)"
      (move)="onMove($event)"
      (moveTo)="openMoveDialogForNodes($event)"
      (reorder)="onReorder($event)"
    />
    @if (canEdit()) {
      <p class="nav__hint">{{ 'navigation.tree.reorderHint' | transloco }}</p>
    }
  </section>

  <div sfSplitterEnd class="nav__pane nav__main">
    @switch (mode()) {
      @case ('favorites') {
        <sf-favorites-view />
      }
      @case ('folder') {
        <sf-nav-folder-view
          [projectKey]="projectKey()"
          [folder]="selected()!"
          [index]="index()"
          [urls]="urls()"
          [loading]="!loaded()"
          [failed]="failed()"
          (openEntry)="openEntry($event)"
          (newItem)="openNewItemHere()"
          (rename)="renameInTree($event)"
          (moveEntries)="openMoveDialog($event)"
          (deleteEntries)="deleteEntries($event)"
          (retry)="changed()"
          (changed)="changed()"
        />
      }
      @case ('item') {
        <sf-nav-item-detail
          [projectKey]="projectKey()"
          [entry]="selected()!"
          [urls]="urls()"
          (changed)="changed()"
          (move)="openMoveDialog([selected()!])"
          (remove)="deleteEntries([selected()!])"
          (openPage)="openPage($event)"
        />
      }
      @default {
        <div class="nav__empty">
          <sf-page-header [title]="'navigation.tree.title' | transloco" />
          @if (emptyMenu()) {
            <sf-empty-state
              icon="menu"
              [title]="'navigation.shell.emptyMenuTitle' | transloco"
              [description]="'navigation.shell.emptyMenuText' | transloco"
              [primaryLabel]="canEdit() ? ('navigation.tree.newItem' | transloco) : null"
              primaryIcon="add_link"
              [secondaryLabel]="canEdit() ? ('navigation.tree.newFolder' | transloco) : null"
              (primary)="openNewItem(null)"
              (secondary)="createFolderAtRoot()"
            />
          } @else {
            <sf-empty-state
              icon="menu"
              [title]="'navigation.shell.emptyTitle' | transloco"
              [description]="'navigation.shell.emptyText' | transloco"
            />
          }
        </div>
      }
    }
  </div>
</sf-splitter>

<sf-create-asset-dialog
  kind="PAGE_REFERENCE"
  [open]="newItemOpen()"
  [submitting]="creating()"
  [projectKey]="projectKey()"
  (create)="submitNewItem($event)"
  (closed)="newItemOpen.set(false)"
/>

@if (moving(); as entries) {
  <sf-folder-move-dialog
    [tree]="folderTree()"
    [excluded]="movingFolders()"
    [count]="entries.length"
    [rootLabel]="'navigation.tree.title' | transloco"
    (chosen)="onMoveChosen($event)"
    (cancelled)="moving.set(null)"
  />
}
