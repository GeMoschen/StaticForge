<div class="navigation">
  <aside class="navigation__tree">
    <div class="navigation__toolbar">
      <sf-button variant="secondary" (click)="newFolder()">New subfolder</sf-button>
      <sf-button variant="secondary" [disabled]="!targetFolderUuid()" (click)="newReference()">
        New reference
      </sf-button>
    </div>

    @if (loading()) {
      <sf-spinner label="Loading navigation…" />
    } @else {
      @if (root(); as tree) {
        <sf-tree>
          <sf-nav-tree-node
            [node]="tree"
            [depth]="0"
            [selectedUuid]="selectedUuid()"
            [isRoot]="true"
            [projectKey]="projectKey()"
            (select)="select($event)"
            (move)="onMove($event)"
            (changed)="onTreeNodeRenamed()"
          />
        </sf-tree>
      } @else {
        <sf-empty-state title="No navigation tree" description="Something went wrong loading the navigation root." />
      }
    }
  </aside>

  <section class="navigation__detail">
    @if (detailLoading()) {
      <sf-spinner label="Loading…" />
    } @else {
      @if (folderDetail(); as folder) {
        <sf-nav-folder-detail
          [projectKey]="projectKey()"
          [folder]="folder"
          [children]="selectedNode()?.children ?? []"
          [isRoot]="isRootSelected()"
          (closed)="closeDetail()"
          (changed)="onFolderChanged()"
          (deleted)="onFolderDeleted()"
        />
      } @else {
        @if (referenceDetail(); as reference) {
          <sf-nav-reference-detail
            [projectKey]="projectKey()"
            [reference]="reference"
            (closed)="closeDetail()"
            (changed)="onReferenceChanged()"
            (deleted)="onReferenceDeleted()"
          />
        } @else {
          <sf-empty-state
            title="Select a node"
            description="Choose a folder or reference from the tree to see its details."
          />
        }
      }
    }
  </section>
</div>

<sf-create-asset-dialog
  kind="FOLDER"
  scope="NAVIGATION"
  [open]="newFolderOpen()"
  [submitting]="creatingFolder()"
  [projectKey]="projectKey()"
  (create)="submitNewFolder($event)"
  (closed)="closeNewFolder()"
/>

<sf-create-asset-dialog
  kind="PAGE_REFERENCE"
  [open]="newReferenceOpen()"
  [submitting]="creatingReference()"
  [projectKey]="projectKey()"
  (create)="submitNewReference($event)"
  (closed)="closeNewReference()"
/>
