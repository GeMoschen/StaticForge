<div class="navigation">
  <aside class="navigation__tree">
    <div class="navigation__toolbar">
      <sf-button variant="secondary" [disabled]="readOnly()" (click)="newFolder()">New subfolder</sf-button>
      <sf-button variant="secondary" [disabled]="readOnly()" (click)="newReference()">New reference</sf-button>
    </div>

    <button
      type="button"
      class="navigation__clear"
      [class.navigation__clear--active]="!selectedUuid() || rootSelected()"
      (click)="selectRoot()"
      (dragover)="onRootDragOver($event)"
      (drop)="onRootDrop($event)"
      (contextmenu)="onRootContextMenu($event)"
    >
      <sf-icon name="home" />
      All navigation
    </button>

    @if (loading()) {
      <sf-spinner label="Loading navigation…" />
    } @else {
      @if (topLevelNodes().length === 0) {
        <sf-empty-state title="No navigation yet" description="Create a folder or reference to get started." />
      } @else {
        <div>
          @for (node of treeNodes(); track node.uuid) {
            <sf-store-tree-node
              [node]="node"
              [depth]="0"
              [selectedUuid]="selectedUuid()"
              [projectKey]="projectKey()"
              leafNoun="Reference"
              [undoable]="true"
              [renameFolder]="renameFolder"
              (select)="select($event)"
              (move)="onMove($event)"
              (changed)="onTreeNodeRenamed()"
            />
          }
        </div>
      }
    }
  </aside>

  <section class="navigation__detail">
    @if (detailLoading()) {
      <sf-spinner label="Loading…" />
    } @else {
      @if (folderDetail(); as folder) {
        <sf-nav-folder-detail
          [projectKey]="projectKey()"
          [folder]="folder"
          [children]="selectedNode()?.children ?? []"
          [release]="selectedNode()?.release"
          (closed)="closeDetail()"
          (changed)="onFolderChanged()"
          (deleted)="onFolderDeleted()"
        />
      } @else {
        @if (referenceDetail(); as reference) {
          <sf-nav-reference-detail
            [projectKey]="projectKey()"
            [reference]="reference"
            [release]="selectedNode()?.release"
            (closed)="closeDetail()"
            (changed)="onReferenceChanged()"
            (deleted)="onReferenceDeleted()"
          />
        } @else {
          <sf-empty-state
            title="Select a node"
            description="Choose a folder or reference from the tree to see its details."
          />
        }
      }
    }
  </section>
</div>

<sf-create-asset-dialog
  kind="FOLDER"
  scope="NAVIGATION"
  [open]="newFolderOpen()"
  [submitting]="creatingFolder()"
  [projectKey]="projectKey()"
  (create)="submitNewFolder($event)"
  (closed)="closeNewFolder()"
/>

<sf-create-asset-dialog
  kind="PAGE_REFERENCE"
  [open]="newReferenceOpen()"
  [submitting]="creatingReference()"
  [projectKey]="projectKey()"
  (create)="submitNewReference($event)"
  (closed)="closeNewReference()"
/>
