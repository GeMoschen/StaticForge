<div class="sf-content-form">
  @for (editor of definition().editors; track editor.name) {
    <div
      class="sf-content-form__editor"
      [class.sf-content-form__editor--half]="editor.width === 'half'"
      [attr.data-sf-editor]="editor.name"
    >
      <sf-editor-outlet [definition]="editor" [control]="controlFor(editor)" [chrome]="chromes().get(editor.name) ?? null" />

      @if (fallbackFor(editor); as fallback) {
        <p class="sf-content-form__fallback" [id]="'fallback-' + editor.name">
          <span class="sf-content-form__fallback-text">
            {{ 'forms.field.notTranslated' | transloco: { text: fallback.text, language: labelOf(fallback.locale) } }}
          </span>
          <button
            type="button"
            class="sf-content-form__copy"
            (click)="copyFallback(editor)"
          >
            {{ 'forms.field.copyFrom' | transloco: { language: labelOf(fallback.locale) } }}
          </button>
        </p>
      }
    </div>
  }
</div>
