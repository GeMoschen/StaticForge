<sf-field [label]="definition().label" [hint]="definition().help">
  <div class="sf-color">
    <div class="sf-color__swatches">
      @for (color of palette; track color) {
        <button
          type="button"
          class="sf-color__swatch"
          [class.sf-color__swatch--active]="isActive(color)"
          [style.background]="color"
          [attr.aria-label]="color"
          [attr.disabled]="definition().readOnly ? '' : null"
          (click)="pick(color)"
        ></button>
      }
    </div>
    <input
      type="color"
      [value]="control().value ?? '#000000'"
      [attr.disabled]="definition().readOnly ? '' : null"
      (change)="pickFrom($event)"
    />
  </div>
</sf-field>
