<sf-field
  [hint]="definition().help"
  [required]="fieldRequired()"
  [empty]="fieldEmpty()"
  [findings]="fieldFindings()"
>
  <sf-catalog
    [items]="items()"
    [types]="types()"
    [label]="definition().label ?? definition().name"
    [catalogId]="catalogId()"
    [summaryOf]="summaryOf"
    [readonly]="readOnly()"
    [level]="level"
    (add)="onAdd($event)"
    (move)="onMove($event)"
    (duplicate)="onDuplicate($event)"
    (remove)="onRemove($event)"
  >
    <ng-template sfCatalogCard [sfCatalogCardItems]="items()" let-item let-index="index">
      <div class="sf-catalog-card" [attr.data-sf-section]="item.id">
        @if (isLoaded(item.type)) {
          <sf-catalog-card-form
            [contentDefinition]="contentDefFor(item.type)"
            [content]="item.card.content"
            [projectKey]="projectKey()"
            [readOnly]="readOnly()"
            [rules]="ruleHub()"
            [rulePrefix]="cardPrefix(index)"
            [issues]="cardPrefix(index) === null ? [] : issues()"
            (valueChange)="onCardValueChange(item.id, $event)"
            (filled)="onCardFilled(item.id, $event)"
          />
        } @else {
          <sf-spinner [label]="'forms.catalog.loading' | transloco" />
        }
      </div>
    </ng-template>
  </sf-catalog>
</sf-field>
