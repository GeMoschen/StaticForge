<sf-field [label]="definition().label" [hint]="definition().help">
  <div class="sf-media">
    <div class="sf-media__drop" sfDropTarget (drop)="onDrop($event)">
      Drag media here
    </div>

    @if (projectKey()) {
      <sf-button variant="secondary" (click)="choose()">Choose</sf-button>
    }

    <input
      type="text"
      placeholder="Media UUID"
      [formControl]="field('uuid')"
      [attr.readonly]="definition().readOnly ? '' : null"
    />
    <input
      type="text"
      placeholder="Alt text"
      [formControl]="field('altOverride')"
      [attr.readonly]="definition().readOnly ? '' : null"
    />
  </div>
</sf-field>

@if (pickerOpen() && projectKey()) {
  <sf-asset-picker-dialog
    [projectKey]="projectKey()!"
    initialType="MEDIA"
    [allowedTypes]="['MEDIA']"
    (picked)="onPicked($event)"
    (closed)="pickerOpen.set(false)"
  />
}
