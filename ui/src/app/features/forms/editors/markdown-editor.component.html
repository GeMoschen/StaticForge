<sf-field [label]="definition().label" [hint]="definition().help" [required]="fieldRequired()" [empty]="fieldEmpty()" [tags]="fieldTags()" [findings]="fieldFindings()">
  <div class="sf-markdown">
    <sf-textarea [formControl]="control()" [rows]="8" monospace [readonly]="!!definition().readOnly" />
    @if (preview) {
      <div class="sf-markdown__preview" [innerHTML]="previewHtml()"></div>
    }
  </div>
</sf-field>
