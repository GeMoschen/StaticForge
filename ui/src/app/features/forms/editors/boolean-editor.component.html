<sf-field [label]="definition().label" [hint]="definition().help">
  <label class="sf-switch">
    <input
      type="checkbox"
      [formControl]="control()"
      [attr.disabled]="definition().readOnly ? '' : null"
    />
    <span class="sf-switch__track" aria-hidden="true"></span>
    <span class="sf-switch__text">{{ control().value ? 'Yes' : 'No' }}</span>
  </label>
</sf-field>
