<sf-field [label]="definition().label" [hint]="definition().help">
  <div class="sf-multiselect">
    @for (option of definition().options ?? []; track option.value) {
      <label class="sf-multiselect__option">
        <input
          type="checkbox"
          [checked]="isChecked(option.value)"
          (change)="toggle(option.value)"
          [attr.disabled]="definition().readOnly ? '' : null"
        />
        <span>{{ option.label }}</span>
      </label>
    }
  </div>
</sf-field>
