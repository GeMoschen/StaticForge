<sf-field [label]="definition().label" [hint]="definition().help" [required]="fieldRequired()" [empty]="fieldEmpty()" [tags]="fieldTags()" [findings]="fieldFindings()">
  <sf-input [formControl]="control()" [readonly]="!!definition().readOnly" [maxlength]="definition().maxLength ?? null" />
  @if (definition().maxLength) {
    <sf-editor-count [count]="count()" [max]="definition().maxLength!" />
  }
</sf-field>
