<sf-field [label]="definition().label" [hint]="definition().help">
  <sf-code-editor
    class="sf-json"
    language="json"
    [label]="definition().label || definition().name"
    [value]="text()"
    [readOnly]="readOnly()"
    [compact]="false"
    (valueChange)="onInput($event)"
  />
  @if (message()) {
    <span class="sf-editor__error">{{ message() }}</span>
  }
</sf-field>
