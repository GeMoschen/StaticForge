<sf-field [label]="definition().label" [hint]="definition().help" [required]="fieldRequired()" [empty]="fieldEmpty()" [tags]="fieldTags()" [findings]="fieldFindings()">
  <sf-code-editor
    class="sf-json"
    language="json"
    [label]="definition().label || definition().name"
    [value]="text()"
    [readOnly]="readOnly()"
    [compact]="false"
    (valueChange)="onInput($event)"
  />
</sf-field>
