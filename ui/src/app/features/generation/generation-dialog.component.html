<div class="scrim" (click)="onBackdrop()"></div>
<div class="dialog" role="dialog" aria-modal="true" aria-label="New generation">
  <header class="dialog__header">
    <h2 class="dialog__title">New generation</h2>
    <button class="dialog__close" type="button" (click)="cancelled.emit()" aria-label="Close">×</button>
  </header>

  <form class="dialog__body" [formGroup]="form">
    <sf-field label="Mode">
      <div class="radios">
        <label class="radio">
          <input type="radio" formControlName="mode" value="FULL" />
          <span>Full</span>
        </label>
        <label class="radio">
          <input type="radio" formControlName="mode" value="INCREMENTAL" />
          <span>Incremental</span>
        </label>
      </div>
    </sf-field>

    <sf-field label="Channels">
      <div class="checkboxes" formArrayName="channels">
        @for (option of channelOptions(); track option; let i = $index) {
          <label class="checkbox">
            <input type="checkbox" [formControlName]="i" />
            <span>{{ option }}</span>
          </label>
        }
      </div>
    </sf-field>

    <sf-field label="Target">
      <select class="select" formControlName="targetId">
        @for (target of targets(); track target.id) {
          <option [ngValue]="target.id ?? null">{{ target.name ?? 'Untitled' }}</option>
        }
      </select>
    </sf-field>

    <sf-field label="Comment">
      <textarea
        class="textarea"
        formControlName="comment"
        rows="3"
        placeholder="Optional note for this run"
      ></textarea>
    </sf-field>

    @if (error()) {
      <p class="dialog__error" role="alert">{{ error() }}</p>
    }

    <footer class="dialog__footer">
      <sf-button variant="ghost" (click)="cancelled.emit()">Cancel</sf-button>
      <sf-button variant="primary" [disabled]="submitting()" (click)="submit()">Start</sf-button>
    </footer>
  </form>
</div>
