@if (row(); as r) {
  <header class="diff__head">
    <div class="diff__title-row">
      <sf-icon class="diff__type" [name]="typeIcon(r.type)" />
      <h2 class="diff__title" id="changes-diff-title">{{ title() }}</h2>
      <sf-button variant="ghost" size="sm" icon="close" [label]="t('diff.close')" (click)="store.closeDiff()" />
    </div>
    <div class="diff__meta">
      <span>{{ meta() }}</span>
      <sf-status size="sm" [tone]="toneOf(r.status)" [icon]="statusIcon(r.status)" [label]="statusText()" />
    </div>
    <div class="diff__tools">
      <span class="diff__legend">{{ t('diff.legend') }}</span>
      @if (route(); as target) {
        <sf-button variant="secondary" size="sm" icon="open_in_new" [link]="target.commands" [queryParams]="target.queryParams">{{ t('diff.open') }}</sf-button>
      }
    </div>
  </header>

  <div class="diff__body" [attr.aria-busy]="store.diffLoading()">
    @if (store.diffLoading() && !store.diff()) {
      <sf-spinner [label]="t('diff.loading')" />
    } @else if (store.diffError()) {
      <p class="diff__error" role="alert">{{ store.diffError() }}</p>
    } @else if (store.diff()) {
      @if (note(); as text) {
        <p class="diff__note">{{ text }}</p>
      }
      <sf-diff [changes]="store.diff()?.changes ?? []" [localeLabels]="store.localeLabels()" />
    }
  </div>
}
