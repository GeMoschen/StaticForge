@if (dialog(); as d) {
  <sf-release-dialog [projectKey]="projectKey()" [mode]="d.mode" [choices]="d.choices" (closed)="dialog.set(null)" />
}
@if (scheduling(); as choices) {
  <sf-schedule-dialog [projectKey]="projectKey()" [types]="['RELEASE']" [choices]="choices" (closed)="scheduling.set(null)" />
}

<sf-page-header class="area__header" [title]="'changes.page.title' | transloco" [subtitle]="'changes.page.subtitle' | transloco">
  <sf-badge sfPageHeaderStatus [label]="'changes.page.count' | transloco: { count: store.total() }" />
</sf-page-header>

@if (access.readOnlyLabel(); as label) {
  <sf-banner tone="info">{{ label }}</sf-banner>
}

<sf-changes-filters />

<div class="area__body">
  @if (store.focusedRow()) {
    <sf-splitter
      class="area__split"
      sized="end"
      paneId="changes-diff"
      [defaultSize]="420"
      [min]="320"
      [max]="640"
      [minOther]="360"
      [label]="'changes.diff.resize' | transloco"
    >
      <div sfSplitterStart class="area__pane">
        <ng-container *ngTemplateOutlet="listTpl" />
      </div>
      <sf-changes-diff sfSplitterEnd class="area__diff" [projectKey]="projectKey()" />
    </sf-splitter>
  } @else {
    <ng-container *ngTemplateOutlet="listTpl" />
  }
</div>

<ng-template #listTpl>
  <sf-changes-list (release)="releaseSelected($event)" (schedule)="scheduleSelected($event)" (discard)="discardSelected($event)" />
</ng-template>
