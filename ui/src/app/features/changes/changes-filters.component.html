<div class="bar" role="search" [attr.aria-label]="t('filters.bar')">
  <sf-search-input
    class="bar__search"
    [value]="store.searchDraft()"
    [placeholder]="t('filters.placeholder')"
    [aria-label]="t('filters.placeholder')"
    (valueChange)="store.onSearch($event)"
  />
  @for (menu of menus(); track menu.id) {
    <sf-menu variant="secondary" size="md" align="start" [text]="menu.text" [label]="menu.name" [items]="menu.items" />
  }
  <span class="bar__end">
    <sf-menu variant="ghost" size="md" [text]="sortText()" [label]="t('sort.label')" [items]="sortItems()" />
  </span>
</div>

@if (chips().length) {
  <ul class="chips" [attr.aria-label]="t('filters.active')">
    @for (chip of chips(); track chip.key) {
      <li><sf-tag removable [label]="chip.label" (removed)="chip.remove()" /></li>
    }
    <li>
      <sf-button variant="ghost" size="md" (click)="store.clearAll()">{{ t('filters.clear') }}</sf-button>
    </li>
  </ul>
}
