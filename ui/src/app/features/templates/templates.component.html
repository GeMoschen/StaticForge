<sf-splitter
  class="templates"
  collapsible
  paneId="templates-tree"
  [defaultSize]="treeWidth"
  [min]="200"
  [max]="440"
  [label]="'templates.tree.resize' | transloco"
>
  <section sfSplitterStart class="templates__pane templates__tree" aria-labelledby="templates-tree-title">
    <div class="templates__head">
      <span class="templates__title" id="templates-tree-title">{{ 'templates.tree.title' | transloco }}</span>
      <sf-menu
        variant="secondary"
        size="sm"
        align="end"
        [text]="'templates.new.button' | transloco"
        [label]="'templates.new.label' | transloco"
        [items]="newItems()"
        [disabled]="!canEdit()"
      />
    </div>
    <sf-tree
      class="templates__treebody"
      treeId="templates"
      filterMode="server"
      hostMenu
      sort="none"
      [multiselect]="false"
      [expandActions]="false"
      [label]="'templates.tree.title' | transloco"
      [projectKey]="projectKey()"
      [loadChildren]="loaderFn()"
      [selection]="treeSelection()"
      [actions]="treeActions"
      [createKinds]="['folder']"
      [allowAction]="allowAction"
      [canDrop]="canDrop"
      [validateName]="validateName"
      [confirmDelete]="confirmDelete"
      [menuItems]="menuItems"
      [search]="search"
      (open)="onOpen($event)"
      (create)="onCreate($event)"
      (renameRequest)="onRenameRequest($event)"
      (delete)="onDelete($event)"
      (move)="onMove($event)"
    />
  </section>

  <div sfSplitterEnd class="templates__pane templates__main">
    @switch (mode()) {
      @case ('favorites') {
        <sf-favorites-view />
      }
      @case ('folder') {
        <sf-templates-folder-view
          [projectKey]="projectKey()"
          [folderUuid]="folderUuid()"
          [index]="index()"
          [tree]="folderTree()"
          [loading]="!loaded()"
          [failed]="failed()"
          (openEntry)="openEntry($event)"
          (openFolder)="openFolder($event)"
          (newTemplate)="openNewTemplate(folderUuid(), $event)"
          (newFolder)="newFolderHere()"
          (rename)="openRename($event)"
          (usedBy)="onFolderViewUsedBy($event)"
          (retry)="retry()"
        />
      }
    }
    <router-outlet />
  </div>
</sf-splitter>

@if (renaming(); as entry) {
  <sf-rename-asset-dialog
    [open]="true"
    [projectKey]="projectKey()"
    [uuid]="entry.uuid"
    [uid]="entry.uid"
    [displayName]="entry.name"
    [submittingName]="renameBusy()"
    [undoableUid]="true"
    (renameDisplayName)="renameDisplayName($event)"
    (uidChanged)="onUidChanged()"
    (closed)="renaming.set(null)"
  />
}

@if (moving(); as entries) {
  <sf-templates-move-dialog [tree]="folderTree()" [entries]="entries" (chosen)="onMoveChosen($event)" (cancelled)="moving.set(null)" />
}

<sf-record-side-panel [(tab)]="usedByTab" tabs="usages" [title]="usedByTitle()" [projectKey]="projectKey()" [usages]="usedByRows()" />
