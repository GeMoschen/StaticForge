<aside class="templates__tree">
  <div class="templates__tree-head">
    <h2>Templates</h2>
  </div>
  @if (store.loading()) {
    <sf-spinner label="Loading templates…" />
  }
  <div class="templates__tree-body" role="tree">
    @for (root of store.topLevelFolders(); track root.uuid) {
      <sf-template-folder-node
        [node]="root"
        [depth]="0"
        [selectedUuid]="store.highlightedFolder()"
        [projectKey]="store.projectKey()"
        [templateKind]="rootKind(root)"
        [templatesByFolder]="store.templatesByFolder()"
        [selectedTemplateUuid]="store.selectedUuid()"
        (select)="store.selectFolder($event)"
        (move)="moveItemTo($event)"
        (selectTemplate)="store.select($event)"
        (newTemplate)="newTemplate.emit()"
        (changed)="onTreeChanged()"
      />
    }
  </div>
</aside>
