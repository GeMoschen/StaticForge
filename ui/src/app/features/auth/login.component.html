<main class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="login__title">Sign in</h1>
    <p class="login__subtitle">Access your StaticForge projects.</p>

    <sf-field label="Username">
      <input type="text" formControlName="username" autocomplete="username" />
    </sf-field>

    <sf-field label="Password">
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </sf-field>

    @if (error()) {
      <p class="login__error" role="alert">{{ error() }}</p>
    }

    <button
      class="login__submit"
      type="submit"
      [disabled]="form.invalid || submitting()"
    >
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <div class="login__hints">
    <p>Forgotten credentials? Ask a StaticForge administrator.</p>
    <p>Session lasts until you sign out — tokens are kept in memory only.</p>
  </div>
</main>
