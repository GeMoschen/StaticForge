<form class="password-change" [formGroup]="form" (ngSubmit)="submit()">
  <h1 class="password-change__title">Change password</h1>

  <sf-field label="Current password">
    <input
      type="password"
      formControlName="currentPassword"
      autocomplete="current-password"
    />
  </sf-field>

  <sf-field label="New password">
    <input
      type="password"
      formControlName="newPassword"
      autocomplete="new-password"
    />
  </sf-field>

  <sf-field label="Confirm new password">
    <input
      type="password"
      formControlName="confirmPassword"
      autocomplete="new-password"
    />
  </sf-field>

  @if (mismatch()) {
    <p class="password-change__error" role="alert">Passwords do not match.</p>
  }

  <button
    class="password-change__submit"
    type="submit"
    [disabled]="form.invalid || submitting()"
  >
    {{ submitting() ? 'Updating…' : 'Update password' }}
  </button>
</form>
