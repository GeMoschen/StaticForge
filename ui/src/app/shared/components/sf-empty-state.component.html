<div class="sf-empty-state">
  @if (icon()) {
    <span class="sf-empty-state__icon" aria-hidden="true">{{ icon() }}</span>
  }
  <h2 class="sf-empty-state__title">{{ title() }}</h2>
  @if (description()) {
    <p class="sf-empty-state__description">{{ description() }}</p>
  }
  <ng-content />
</div>
