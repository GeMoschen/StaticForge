<sf-code-editor
  class="octl-editor__source"
  [class.octl-editor__source--invalid]="hasErrors()"
  language="octl"
  [value]="value()"
  [label]="label()"
  [diagnostics]="diagnostics()"
  [readOnly]="readOnly()"
  [names]="names()"
  [format]="format()"
  [svg]="svg()"
  [invalid]="hasErrors()"
  [attr.aria-describedby]="diagnosticsId"
  (valueChange)="valueChange.emit($event)"
/>
<div [id]="diagnosticsId" class="octl-editor__diagnostics" aria-live="polite">
  @for (diag of diagnostics(); track $index) {
    <div class="diagnostic" [class.diagnostic--error]="diag.severity === 'ERROR'" [class.diagnostic--warning]="diag.severity !== 'ERROR'">
      <span>{{ diag.severity }} {{ diag.code }}</span>
      @if (diag.line) {
        <button
          type="button"
          class="diagnostic__position"
          [attr.aria-label]="'Go to line ' + diag.line + ', column ' + (diag.column ?? 0)"
          (click)="goTo(diag)"
        >
          ({{ diag.line }}:{{ diag.column ?? 0 }})
        </button>
      }
      <span>— {{ diag.message }}</span>
    </div>
  }
</div>
