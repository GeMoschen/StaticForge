<sf-button
  #trigger
  [variant]="variant()"
  [size]="size()"
  [icon]="text() ? null : icon()"
  [iconTrailing]="text() ? 'expand_more' : null"
  [label]="text() ? null : label()"
  [disabled]="disabled()"
  aria-haspopup="menu"
  [aria-expanded]="open()"
  [aria-controls]="open() ? menuId : null"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
  >{{ text() }}</sf-button
>

@if (open()) {
  <div #panel class="sf-menu" role="menu" [id]="menuId" [attr.aria-label]="label()" (keydown)="onMenuKeydown($event)">
    @for (item of items(); track item.id; let first = $first) {
      @if (item.separatorBefore && !first) {
        <div class="sf-menu__separator" role="separator"></div>
      }
      @if (item.link && !item.disabled) {
        <a
          class="sf-menu__item"
          [class.sf-menu__item--danger]="item.danger"
          role="menuitem"
          tabindex="-1"
          [routerLink]="item.link"
          (click)="choose(item, $event)"
        >
          @if (item.icon) {
            <sf-icon class="sf-menu__icon" [name]="item.icon" />
          }
          <span class="sf-menu__label">{{ item.label }}</span>
        </a>
      } @else {
        <button
          type="button"
          class="sf-menu__item"
          [class.sf-menu__item--danger]="item.danger"
          role="menuitem"
          tabindex="-1"
          [attr.aria-disabled]="item.disabled || null"
          (click)="choose(item, $event)"
        >
          @if (item.icon) {
            <sf-icon class="sf-menu__icon" [name]="item.icon" />
          }
          <span class="sf-menu__label">{{ item.label }}</span>
        </button>
      }
    }
  </div>
}
