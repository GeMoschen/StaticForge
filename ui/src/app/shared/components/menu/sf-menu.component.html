<sf-button
  #trigger
  [variant]="variant()"
  [size]="size()"
  [icon]="text() ? null : icon()"
  [iconTrailing]="text() ? 'expand_more' : null"
  [label]="text() ? null : label()"
  [disabled]="disabled()"
  aria-haspopup="menu"
  [aria-expanded]="open()"
  [aria-controls]="open() ? menuId : null"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
  >{{ text() }}</sf-button
>

@if (open()) {
  <sf-menu-panel
    [items]="items()"
    [label]="label()"
    [panelId]="menuId"
    [anchor]="triggerElement()"
    [anchorOptions]="anchorOptions()"
    [initialFocus]="initialFocus()"
    (activated)="onActivated($event)"
    (closeRequest)="onCloseRequest($event)"
  />
}
