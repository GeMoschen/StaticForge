<div class="scrim" (click)="close()"></div>
<div class="dialog" role="dialog" aria-modal="true" [attr.aria-label]="title()">
  <header class="dialog__header">
    <h2 class="dialog__title">{{ title() }}</h2>
    <button type="button" class="dialog__close" aria-label="Close" (click)="close()">
      <sf-icon name="close" />
    </button>
  </header>

  <div class="dialog__toolbar">
    @if (typeOptions().length > 1) {
      <select class="dialog__type" [value]="type()" (change)="onTypeChange($event)" [attr.aria-label]="picksSources() ? 'Source type' : 'Asset type'">
        @for (option of typeOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    }
    @if (type() === 'RECORD' && datasets().length > 1) {
      <select class="dialog__type" [value]="datasetUuid()" (change)="onDatasetChange($event)" aria-label="Dataset">
        @for (ds of datasets(); track ds.uuid) {
          <option [value]="ds.uuid">{{ ds.displayName ?? ds.uid }}</option>
        }
      </select>
    }
    <input
      type="search"
      class="dialog__search"
      placeholder="Search…"
      (input)="onSearchInput($event)"
    />
  </div>

  <div class="dialog__body">
    @if (hasFolders()) {
      <aside class="dialog__tree">
        <button
          type="button"
          class="dialog__tree-root"
          [class.dialog__tree-root--active]="!folderUuid()"
          (click)="selectFolder(null)"
        >
          <sf-icon name="home" />
          All
        </button>
        @for (folder of tree(); track folder.uuid) {
          <sf-asset-picker-folder-node
            [node]="folder"
            [depth]="0"
            [selectedUuid]="folderUuid()"
            (select)="selectFolder($event)"
          />
        }
      </aside>
    }

    <div class="dialog__results">
      @if (loading()) {
        <sf-spinner label="Loading…" />
      } @else if (items().length === 0) {
        <sf-empty-state
          [title]="emptyTitle()"
          [description]="type() === 'RECORD' ? 'Try a different search or dataset.' : hasFolders() ? 'Try a different search or folder.' : 'Try a different search.'"
        />
      } @else {
        <ul class="dialog__list">
          @for (item of items(); track item.uuid) {
            <li>
              <button
                type="button"
                class="dialog__item"
                [style.padding-left]="item.depth ? 'calc(var(--sf-2) + ' + item.depth * 14 + 'px)' : null"
                (click)="pick(item)"
              >
                <span class="dialog__item-name">{{ item.displayName ?? item.uid }}</span>
                @if (item.dataset) {
                  <span class="dialog__item-badge">{{ item.dataset }}</span>
                }
                <span class="dialog__item-meta">{{ item.meta ?? item.uid }}</span>
              </button>
            </li>
          }
        </ul>
      }
    </div>
  </div>
</div>
