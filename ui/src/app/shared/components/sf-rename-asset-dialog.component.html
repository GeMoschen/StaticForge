@if (open()) {
  <div class="scrim" (click)="close()"></div>
  <div class="dialog" #panel role="dialog" aria-modal="true" aria-label="Rename">
    <header class="dialog__header">
      <h2 class="dialog__title">Rename</h2>
      <button type="button" class="dialog__close" aria-label="Close" (click)="close()">×</button>
    </header>

    <div class="dialog__body">
      @if (isRoot()) {
        <p class="dialog__hint">This is the project's root — it can't be renamed.</p>
      } @else {
        <section class="dialog__section">
          <sf-field label="Display name">
            <input
              #nameInput
              type="text"
              autocomplete="off"
              [value]="draft()"
              (input)="onInput($event)"
              (keydown.enter)="saveName()"
            />
            @if (invalid() && touched()) {
              <span class="error">A name is required</span>
            }
          </sf-field>
          <div class="dialog__actions">
            <sf-button type="button" variant="primary" [disabled]="submittingName()" (click)="saveName()">
              @if (submittingName()) {
                <sf-spinner label="Saving…" />
              } @else {
                Save
              }
            </sf-button>
          </div>
        </section>

        <section class="dialog__section">
          <span class="dialog__section-label">UID</span>
          <sf-uid-rename
            [projectKey]="projectKey()"
            [uuid]="uuid()"
            [uid]="uid()"
            (uidChanged)="onUidChanged($event)"
          />
        </section>
      }
    </div>

    @if (isRoot()) {
      <div class="dialog__actions dialog__actions--footer">
        <sf-button type="button" variant="ghost" (click)="close()">Close</sf-button>
      </div>
    }
  </div>
}
