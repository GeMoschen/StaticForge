@for (entry of open(); track entry.state) {
  <sf-menu-panel
    [items]="entry.state.items"
    [label]="'shared.menu.contextLabel' | transloco"
    [anchor]="entry.anchor"
    [anchorOptions]="entry.options"
    initialFocus="first"
    (activated)="onActivated($event)"
    (closeRequest)="onCloseRequest($event)"
  />
}
