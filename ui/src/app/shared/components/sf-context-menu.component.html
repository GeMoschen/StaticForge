@if (menu.state(); as state) {
  <div
    #panel
    class="sf-context-menu"
    role="menu"
    [style.left.px]="state.x"
    [style.top.px]="state.y"
  >
    @for (item of state.items; track $index) {
      @if (item.separator) {
        <div class="sf-context-menu__separator"></div>
      } @else {
        <button
          type="button"
          class="sf-context-menu__item"
          [class.sf-context-menu__item--danger]="item.danger"
          [disabled]="item.disabled"
          role="menuitem"
          (click)="select(item.action)"
        >
          @if (item.icon) {
            <sf-icon class="sf-context-menu__icon" [name]="item.icon" />
          }
          <span>{{ item.label }}</span>
        </button>
      }
    }
  </div>
}
