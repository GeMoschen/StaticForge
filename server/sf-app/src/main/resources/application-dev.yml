spring:
  config:
    activate:
      on-profile: dev
  # File-based H2 so content survives restarts. SF_DB_FILE is the H2 database path without the `.mv.db` suffix;
  # a relative path must start with `./` and resolves against the working directory, like SF_MEDIA_ROOT.
  datasource:
    url: jdbc:h2:file:${SF_DB_FILE:./build/db/staticforge};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: ${SF_DB_USER:sa}
    password: ${SF_DB_PASSWORD:}

sf:
  security:
    jwt:
      algorithm: HS256
      secret: dev-only-secret-please-change-0123456789
  # The default filesystem index under ./build/search-index; set SF_SEARCH_LIVE_INDEXING=false to watch it lag.
  search:
    live-indexing: ${SF_SEARCH_LIVE_INDEXING:true}

logging:
  level:
    com.acme.staticforge: DEBUG

server:
    port: 8081
