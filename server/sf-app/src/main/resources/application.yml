info:
  app:
    name: staticforge-server
    version: 0.1.0

server:
  port: 8080

spring:
  application:
    name: staticforge-server
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

sf:
  security:
    jwt:
      algorithm: HS256
      issuer: https://cms.example.com
      secret: "${SF_JWT_SECRET:}"
      # access-token-ttl/refresh-token-ttl/… populated in M1
    # Rules for a new password (M26): self change, admin create and admin reset. Always at most 72 UTF-8 bytes.
    # password:
    #   min-length: 12
    #   require-mixed: false   # true: at least one letter and at least one digit or symbol
  media:
    store: filesystem
    root: "${SF_MEDIA_ROOT:./build/media}"
    max-upload-size: 100MB
    strip-exif: true
  generate:
    parallelism: 16
    output-root: "${SF_OUTPUT_ROOT:./build/out}"
    keep-builds: 5
    max-file-size: 32MB
    render-timeout: 5s
    cleanup-legacy-output: true
  search:
    # Embedded Lucene index per project (M23). Derived from the database: deleting it is safe, it is rebuilt on start.
    # One application instance per index root (Lucene write lock), see infra/docs/deploy-runbook.md.
    index-root: "${SF_SEARCH_INDEX_ROOT:./build/search-index}"
    directory: filesystem
    refresh-interval: 1s
    max-text-chars: 200000
    catch-up-max-revisions: 5000
    rebuild-batch-size: 500
    ram-buffer-mb: 64
    live-indexing: true
  scheduler:
    # Scheduled releases and builds (M27.4). Every node that polls may execute due actions; a conditional-update
    # lease makes each one run once. node-id defaults to hostname:pid and must differ between nodes.
    enabled: true
    poll-interval: 15s
    batch-size: 20
    lease: 2m
    # node-id: cms-1
  housekeeping:
    # System jobs (M29): instance-level background work on the scheduler's poll, at most once at a time on any node.
    # These values seed each job's row on the first start (and "Reset to defaults"); after that the admin's settings
    # in the Jobs page win. Each job adds its own block here: sf.housekeeping.<job-key>.enabled / .cron / its keys.
    enabled: true
    zone: UTC
    history-per-job: 200
    blob-sweep:
      enabled: true
      cron: "30 3 * * *"
      # Mark and sweep of the blob store (spec §11.2): blobs no version of any revision, media_variant row or run
      # references are deleted once they were neither created nor referenced within grace-hours; store bytes without
      # a row once their modification time is that old. Restore drills: the blob store snapshot must be at least as
      # old as grace-hours plus the backup interval, or run them with this job disabled (§26.5).
      grace-hours: 24
      batch-size: 1000
    audit-purge:
      enabled: true
      cron: "0 4 * * *"
      # Audit entries older than this are deleted (spec §26.3), in batches of batch-size. At least 30.
      retention-days: 365
      batch-size: 5000
    refresh-token-cleanup:
      enabled: true
      cron: "15 * * * *"
      # A family whose every token is revoked or expired is kept this long after its newest token expired, so a
      # stolen token presented shortly after expiry is still detected as reuse. Families past their absolute expiry go.
      reuse-window: 7d
    media-variant-backfill:
      enabled: true
      cron: "0 2 * * *"
      # Creates variants of the current sf.media.variants policy that media files lack (added definitions, failed
      # encodes) in the media_variant table only: no revision, no draft. At most max-per-run attempts per run.
      max-per-run: 500
      # Also closed (historical) versions, so rebuilding old revisions gets the variants.
      include-historical: false
  revision:
    retention-days: unlimited
  cache:
    # Compiled CDL + OCTL reused across preview requests (spec §21.5); generation memoizes per build.
    compiled-templates:
      max-size: 2000
      idle: 30m
