info:
  app:
    name: staticforge-server
    version: 0.1.0

server:
  port: 8080

spring:
  application:
    name: staticforge-server
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

sf:
  # This node's name (M29.2.1): recorded on the generation runs it executes and, unless sf.scheduler.node-id overrides
  # it, the lease owner of the scheduler and the system jobs. Defaults to <hostname>-<pid>; set a stable name per node
  # so a restarted node recovers its interrupted runs at once. Must differ between nodes.
  node-id: "${SF_NODE_ID:}"
  security:
    jwt:
      algorithm: HS256
      issuer: https://cms.example.com
      secret: "${SF_JWT_SECRET:}"
      # access-token-ttl/refresh-token-ttl/… populated in M1
    # Rules for a new password (M26): self change, admin create and admin reset. Always at most 72 UTF-8 bytes.
    # password:
    #   min-length: 12
    #   require-mixed: false   # true: at least one letter and at least one digit or symbol
  media:
    store: filesystem
    root: "${SF_MEDIA_ROOT:./build/media}"
    max-upload-size: 100MB
    strip-exif: true
  generate:
    parallelism: 16
    output-root: "${SF_OUTPUT_ROOT:./build/out}"
    keep-builds: 5
    max-file-size: 32MB
    render-timeout: 5s
    cleanup-legacy-output: true
    # How often a running build refreshes its heartbeat (M29.2.1); at most 30s, well below the recovery job's staleAfter.
    heartbeat-interval: 15s
    # How long an Idempotency-Key of POST /generations is remembered (M29.2.4, evicted by the memory-eviction job).
    idempotency-ttl: 24h
  search:
    # Embedded Lucene index per project (M23). Derived from the database: deleting it is safe, it is rebuilt on start.
    # One application instance per index root (Lucene write lock), see infra/docs/deploy-runbook.md.
    index-root: "${SF_SEARCH_INDEX_ROOT:./build/search-index}"
    directory: filesystem
    refresh-interval: 1s
    max-text-chars: 200000
    catch-up-max-revisions: 5000
    rebuild-batch-size: 500
    ram-buffer-mb: 64
    live-indexing: true
  scheduler:
    # Scheduled releases and builds (M27.4). Every node that polls may execute due actions; a conditional-update
    # lease makes each one run once. node-id defaults to sf.node-id; set it only to override that for the scheduler.
    enabled: true
    poll-interval: 15s
    batch-size: 20
    lease: 2m
    # node-id: cms-1
  housekeeping:
    # System jobs (M29): instance-level background work on the scheduler's poll, at most once at a time on any node.
    # These values seed each job's row on the first start (and "Reset to defaults"); after that the admin's settings
    # in the Jobs page win. Each job adds its own block here: sf.housekeeping.<job-key>.enabled / .cron / its keys.
    enabled: true
    zone: UTC
    history-per-job: 200
    generation-run-recovery:
      # Fails queued/running builds nothing executes any more (M29.2.1): at startup and every 5 minutes.
      enabled: true
      cron: "*/5 * * * *"
      stale-after: 5m
    build-output-cleanup:
      # Staged output of failed/cancelled/deleted runs, stale .current-* links, folders of deleted targets (M29.2.2).
      enabled: true
      cron: "10 3 * * *"
      min-age: 1h
    generation-run-retention:
      # Deletes runs older than keep-days beyond the newest keep-per-project, unless protected (M29.3.1).
      enabled: true
      cron: "15 4 * * *"
      keep-days: 90
      keep-per-project: 50
    memory-eviction:
      # Drops idle login-limiter buckets and expired generation idempotency keys (M29.2.4).
      enabled: true
      cron: "*/10 * * * *"
    revision-compaction:
      # Weekly revision compaction (M29.4, spec §7.7). Acts only on projects that opted in (project settings,
      # PUT /projects/{key}/compaction with their own olderThanDays >= 30); history there collapses to the last version
      # of each UTC day, keeping every released, retained-build and pinned version. batch-assets: assets per short
      # transaction holding the project's revision lock.
      enabled: true
      cron: "0 3 * * 0"
      batch-assets: 200
  cache:
    # Compiled CDL + OCTL reused across preview requests (spec §21.5); generation memoizes per build.
    compiled-templates:
      max-size: 2000
      idle: 30m
