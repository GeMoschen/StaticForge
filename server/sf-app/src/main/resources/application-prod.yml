spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:staticforge}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
  liquibase:
    contexts: prod

sf:
  security:
    jwt:
      algorithm: RS256
      issuer: ${SF_JWT_ISSUER:https://cms.example.com}
      key-store: ${SF_JWT_KEYSTORE:file:/etc/staticforge/jwt.p12}

server:
  forward-headers-strategy: framework
