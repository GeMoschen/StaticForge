<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Links that go somewhere</title>
  <meta name="description" content="Every a[href] below has a target, declares itself a button, or is a placeholder without href.">
</head>
<body>
  <h1 id="intro">Links that go somewhere</h1>
  <a href="#intro">a fragment</a>
  <a href="#top">the top</a>
  <a href="../index.html">a page</a>
  <a href="#" role="button">a script-driven button</a>
  <a href="" role="Button">another one</a>
  <a>a placeholder without href</a>
</body>
</html>
