<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Buttons with text</title>
  <meta name="description" content="A fixture page for the accessibility checks: Buttons with text.">
</head>
<body>
  <main id="content">
    <h1>Buttons with text</h1>
    <p><button type="button">Menu</button></p>
    <p><button type="button" aria-label="Close"><span class="icon"></span></button></p>
    <p><button type="button"><img src="assets/media/search.png" alt="Search"></button></p>
    <p><span id="play-label">Play</span><span role="button" tabindex="0" aria-labelledby="play-label"></span></p>
    <p><button type="button" title="Print"><span class="icon"></span></button></p>
    <p><button type="button" hidden></button></p>
  </main>
</body>
</html>
