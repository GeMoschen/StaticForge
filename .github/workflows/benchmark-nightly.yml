name: Generation benchmark nightly

# Runs the §18.6 generation-performance benchmark (§26.1 perf, §25.1 perf row) at
# the heavy fixture sizes. Nightly + manual only — the 50,000-page fixture can take
# tens of minutes and is far too slow for a per-push gate (see infra/scripts/README-benchmark.md).

on:
  schedule:
    - cron: "0 3 * * 0" # 03:00 UTC Sunday
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmark (${{ matrix.pages }} pages)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pages: [5000, 50000]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The driver script sets SF_PERF=true and forwards the page count; it prints
      # the summary and exits non-zero if the benchmark JUnit test was skipped/failed.
      - name: Run benchmark
        run: infra/scripts/benchmark-generation.sh ${{ matrix.pages }}
        env:
          SF_PERF: "true"
          SF_PERF_PAGES: "${{ matrix.pages }}"

      - name: Upload benchmark summary
        uses: actions/upload-artifact@v4
        with:
          name: generation-summary-${{ matrix.pages }}
          path: server/sf-app/build/perf-results/generation-summary.txt
          if-no-files-found: warn
