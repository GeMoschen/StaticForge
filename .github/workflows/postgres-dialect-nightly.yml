name: Postgres dialect nightly

# Runs the backend test suite against real PostgreSQL (§22.3 / §22.4 rule 6) so H2
# (MODE=PostgreSQL) speed does not hide dialect divergence. Nightly + manual only:
# spinning a real DB is expensive for a PR gate. Report-oriented (continue-on-error)
# pending Testcontainers wiring.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:

jobs:
  postgres-dialect:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sf
          POSTGRES_PASSWORD: sf
          POSTGRES_DB: sf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sf"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Preferred wiring (once a Testcontainers profile exists): the suite points at
      # the PostgreSQL JDBC URL and runs the same tests with ddl-auto=validate against
      # a Liquibase-migrated Postgres schema. Command (documented, not active yet):
      #   ./gradlew test --no-daemon \
      #     -Dspring.profiles.active=postgres \
      #     -Dspring.datasource.url=jdbc:postgresql://localhost:5432/sf
      #     -Dspring.datasource.username=sf -Dspring.datasource.password=sf
      - name: Run dialect suite against PostgreSQL (documented)
        run: |
          echo "§22.3 dialect suite: run the test suite with the `postgres` profile"
          echo "against the $POSTGRES_HOST:5432 container once Testcontainers wiring lands."
          echo "Until then this job documents the exact gradle command and leaves the"
          echo "database container in place for local/ad-hoc runs."
